# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "working-web"
icon        = "💶"
description = "Shared household-expense tracker."
shape       = "streamlit"
# Every tracked root folder (app, src, tests, scripts, docs) is in the streamlit
# preset, so no exception is needed; a new root folder is declared here with a reason.
extra_roots = []

# [vendored] -- components copied byte-for-byte from project-scaffolding, with the
# scaffold commit each came from. Re-vendor through /propagate-vendored, never by hand.
[vendored]
structure_ratchet = { src = "scripts/structure_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/structure_ratchet.py" }
box_lock_gate = { src = "scripts/box_lock_gate.ps1", sha = "98cdb1b7727d12a5c233580478e6fae40d98e6f3", dest = "scripts/box_lock_gate.ps1" }
instruction_ratchet = { src = "scripts/instruction_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/instruction_ratchet.py" }
doc_refs_ratchet = { src = "scripts/doc_refs_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/doc_refs_ratchet.py" }
dead_code_ratchet = { src = "scripts/dead_code_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/dead_code_ratchet.py" }
static_ratchet = { src = "scripts/static_ratchet.py", sha = "537cf3931b57e7453ed251850c0dbeac042b03bf", dest = "scripts/static_ratchet.py" }
docs_ratchet = { src = "scripts/docs_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/docs_ratchet.py" }
comment_ratchet = { src = "scripts/comment_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/comment_ratchet.py" }
conventions_ratchet = { src = "scripts/conventions_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/conventions_ratchet.py" }

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/structure_ratchet.py, which fails when a
# new file passes 1,000 lines, a new function 100 lines or a flat directory 40 modules,
# when a baselined offender grows past its size in .structure-ratchet-baseline.json, when
# src imports app, and when the root folders do not match `shape` plus `extra_roots`.
# Existing offenders are baselined at today's size, never excluded. Exit 3 (git unusable,
# an unparseable file, an unknown shape) fails the gate.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet lint over the agent
# instruction files (CLAUDE.md, AGENTS.md, .claude/rules, any SKILL.md). The gate
# (scripts/verify-before-ship.ps1) runs scripts/instruction_ratchet.py, which fails when a
# rule's hit count in a file rises above .instruction-ratchet-baseline.json or a file
# passes its size cap. Existing hits are baselined at today's count, never excluded.
# Exit 3 (git unusable, an unreadable file, an unclosed fence) fails the gate.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet check that README.md, CLAUDE.md and
# docs/**/*.md name only repo paths, modules and links that exist. The gate
# (scripts/verify-before-ship.ps1) runs scripts/doc_refs_ratchet.py, which fails on a
# dangling reference not recorded in .doc-refs-ratchet-baseline.json. Existing
# references are baselined, never excluded. Exit 3 (git unusable, a non-UTF-8 file, an
# unclosed fence) fails the gate.
[doc_refs_ratchet]
enabled  = true
baseline = ".doc-refs-ratchet-baseline.json"

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet check for Python functions,
# classes and methods that nothing in the repo refers to. The gate
# (scripts/verify-before-ship.ps1) runs scripts/dead_code_ratchet.py, which fails on a
# definition not recorded in .dead-code-ratchet-baseline.json. Existing dead code is
# baselined, never excluded. Exit 3 (git unusable, a .py file that does not parse) fails
# the gate.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

# [static_ratchet] -- the scaffold's baseline-and-ratchet check for duplicated blocks
# (jscpd), unused imports and variables, and a curated set of likely-bug and security
# patterns (ruff). The gate (scripts/verify-before-ship.ps1) runs scripts/static_ratchet.py,
# which fails on a finding not recorded in .static-ratchet-baseline.json. Existing findings
# are baselined, never excluded; vendored destinations are left out automatically. Exit 3
# (no npx, ruff missing, a detector that could not run) fails the gate.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"

# [docs_ratchet] -- the scaffold's baseline-and-ratchet check of the README and docs
# convention: the root README.md stays under a size budget, and README.md and docs/**/*.md
# carry no issue references, dated headings or changelog headings beyond the committed
# baseline. The gate (scripts/verify-before-ship.ps1) runs scripts/docs_ratchet.py, which
# fails when either measure rises above .docs-ratchet-baseline.json. Existing debt is
# baselined, never excluded. Exit 3 (git unusable, a non-UTF-8 file, an unclosed fence)
# fails the gate.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [comment_ratchet] -- the scaffold's baseline-and-ratchet check that product-code comments
# state the present-tense why instead of citing issue numbers. The gate
# (scripts/verify-before-ship.ps1) runs scripts/comment_ratchet.py, which fails when a
# file's count of `#NNN` references in comments rises above .comment-ratchet-baseline.json.
# Tests and vendored components are left out automatically. Existing references are
# baselined, never excluded. Exit 3 (git unusable, a file that cannot be scanned) fails
# the gate.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet lint that holds fleet
# conventions as stdlib `ast` rules. The gate (scripts/verify-before-ship.ps1) runs
# scripts/conventions_ratchet.py, which fails when a file's hit count for an enabled rule
# rises above .conventions-ratchet-baseline.json. Enabled here: no-window (a Windows app
# spawns no console), logging-not-print (app/ and src/ log through src/logger.py) and
# no-drive-path (locations come from config.json). secret-compare and git-wrapper are off:
# the repo has neither a constant-time-compare helper nor a git wrapper. Existing hits are
# baselined, never excluded. Exit 3 (git unusable, a .py file that does not parse) fails
# the gate.
[conventions_ratchet]
enabled  = true
baseline = ".conventions-ratchet-baseline.json"
rules    = ["no-window", "logging-not-print", "no-drive-path"]
